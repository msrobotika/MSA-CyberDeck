name: SuperFlyper Android Debug
on:
  push:
    branches: [feature/superflyper-usb-v0-1]
  workflow_dispatch:
jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned debug candidate
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: superflyper-debug-candidate
          path: app/build/outputs/apk/debug/*.apk
